<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Dmn Bluetooth GTK app wireframe</title>
  <desc id="desc">A desktop window with a phone selection sidebar, notification table, and a privacy-safe desktop alert preference panel.</desc>
  <rect width="1280" height="760" fill="#edf1f5"/>
