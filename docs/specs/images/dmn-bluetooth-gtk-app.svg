  <text x="40" y="68" font-family="sans-serif" font-size="14" fill="#536272">Concept wireframe · desktop alerts are optional; the in-app feed is authoritative</text>
  <rect x="40" y="92" width="1200" height="612" rx="14" fill="#fff" stroke="#bbc6d0" stroke-width="2"/>
