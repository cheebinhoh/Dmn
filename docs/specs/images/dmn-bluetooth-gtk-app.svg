<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Dmn Bluetooth current GTK app layout</title>
  <desc id="desc">A wide application window with Bluetooth adapter and scan controls, sortable device rows with selection and per-device connection and monitoring actions, and a selected-device status and live notification feed. A Copy-only context menu is open on selectable notification text.</desc>
  <defs>
    <style>
      .window { fill: #ffffff; stroke: #b9b9b9; stroke-width: 1.5; }
      .bar { fill: #f6f5f4; }
      .line { stroke: #deddda; stroke-width: 1; }
      .text { fill: #241f31; font-family: sans-serif; }
      .muted { fill: #5e5c64; font-family: sans-serif; }
      .small { font-size: 13px; }
      .button { fill: #ffffff; stroke: #c0bfbc; stroke-width: 1; }
      .primary { fill: #3584e4; stroke: #3584e4; }
      .disabled { fill: #f6f5f4; stroke: #deddda; }
      .selected { fill: #f2f2f2; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f6f5f4"/>
  <text class="text" x="32" y="38" font-size="24" font-weight="700">Dmn Bluetooth · current GTK interface</text>
  <text class="muted" x="32" y="63" font-size="14">Illustrative wide-window state · controls and behavior match the implementation</text>
  <rect class="window" x="32" y="84" width="1216" height="640" rx="12"/>

  <!-- Device pane header -->
  <rect class="bar" x="33" y="85" width="474" height="52" rx="11"/>
  <text class="text" x="54" y="118" font-size="19" font-weight="700">Devices</text>
  <rect class="button" x="454" y="99" width="36" height="30" rx="6"/>
  <text class="muted" x="467" y="120" font-size="19">⋮</text>
  <path class="line" d="M32 137H507"/>

  <!-- Device detail header -->
  <rect class="bar" x="508" y="85" width="739" height="52" rx="11"/>
  <path d="M32 137H1248" class="line"/>
  <rect class="button" x="527" y="97" width="38" height="32" rx="6"/>
  <text class="text" x="539" y="119" font-size="22">‹</text>
  <text class="text" x="580" y="118" font-size="19" font-weight="700">Device</text>
  <rect class="button" x="1199" y="97" width="34" height="32" rx="6"/>
  <text class="muted" x="1210" y="119" font-size="18">⋮</text>
  <path class="line" d="M507 85V724"/>

  <!-- Inventory controls -->
  <text class="muted small" x="54" y="162">Choose a phone to monitor. Selection is saved separately from pairing or connecting.</text>
  <rect class="button" x="54" y="177" width="430" height="34" rx="6"/>
  <text class="text small" x="69" y="199">Built-in Bluetooth · AA:BB:CC:DD:EE:FF</text>
  <text class="muted" x="461" y="199" font-size="15">▾</text>
  <rect class="button" x="54" y="220" width="126" height="34" rx="6"/>
  <text class="text small" x="66" y="242">Refresh devices</text>
  <rect class="button" x="187" y="220" width="142" height="34" rx="6"/>
  <text class="text small" x="199" y="242">Scan for devices</text>
  <rect class="disabled" x="336" y="220" width="104" height="34" rx="6"/>
  <text class="muted small" x="348" y="242">Stop scan</text>

  <text class="text small" x="65" y="282" font-weight="700">Name ↑</text>
  <text class="text small" x="348" y="282" font-weight="700">Status</text>
  <path class="line" d="M54 292H484"/>

  <!-- Device row one -->
  <rect x="54" y="293" width="430" height="112" fill="#ffffff"/>
  <rect x="68" y="308" width="18" height="18" rx="3" fill="#3584e4"/>
  <path d="m72 317 4 4 7-9" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text class="text" x="98" y="323" font-size="15" font-weight="700">iPhone Genghis</text>
  <text class="muted small" x="98" y="345">Paired · Connected · Ready · waiting for new notifications</text>
  <rect class="button" x="188" y="359" width="116" height="32" rx="6"/>
  <text class="text small" x="207" y="380">Disconnect</text>
  <rect class="button" x="310" y="359" width="160" height="32" rx="6"/>
  <text class="text small" x="326" y="380">Stop monitoring</text>
  <path class="line" d="M54 405H484"/>

  <!-- Device row two -->
  <rect x="68" y="420" width="18" height="18" rx="3" fill="#ffffff" stroke="#8e8d8b"/>
  <text class="text" x="98" y="435" font-size="15" font-weight="700">iPhone Old</text>
  <text class="muted small" x="98" y="457">Not paired · Disconnected</text>
  <rect class="disabled" x="188" y="470" width="116" height="32" rx="6"/>
  <text class="muted small" x="225" y="491">Connect</text>
  <rect class="disabled" x="310" y="470" width="160" height="32" rx="6"/>
  <text class="muted small" x="325" y="491">Start monitoring</text>
  <path class="line" d="M54 515H484"/>

  <!-- Saved selection and filter -->
  <rect class="disabled" x="54" y="535" width="122" height="34" rx="6"/>
  <text class="muted small" x="67" y="557">Save selection</text>
  <rect class="disabled" x="182" y="535" width="132" height="34" rx="6"/>
  <text class="muted small" x="195" y="557">Discard changes</text>
  <rect x="337" y="542" width="16" height="16" rx="3" fill="#ffffff" stroke="#8e8d8b"/>
  <text class="text small" x="361" y="556">Selected only</text>
  <text class="muted small" x="54" y="601">Bluetooth devices updated.</text>

  <!-- Selected device status -->
  <text class="text" x="552" y="179" font-size="23" font-weight="700">iPhone Genghis</text>
  <text class="muted" x="552" y="204" font-size="14">Paired · Connected · Saved · Ready · waiting for new notifications</text>
  <text class="text" x="552" y="247" font-size="18" font-weight="700">Notifications · iPhone Genghis</text>

  <!-- Live event feed -->
  <rect x="540" y="263" width="681" height="106" rx="7" fill="#ffffff"/>
  <text class="muted small" x="558" y="286">16:50:38 · Added</text>
  <text class="text" x="558" y="311" font-size="15">Messages · New message received</text>
  <text class="text" x="558" y="334" font-size="14">A message preview from the current monitor session.</text>
  <path class="line" d="M540 369H1221"/>
  <text class="muted small" x="558" y="393">16:48:04 · Updated</text>
  <text class="text" x="558" y="418" font-size="15">Calendar · Event updated</text>
  <text class="text" x="558" y="441" font-size="14">Only attributes received from ANCS are displayed.</text>
  <path class="line" d="M540 476H1221"/>

  <!-- Copy-only context menu -->
  <rect x="769" y="438" width="202" height="66" rx="8" fill="#ffffff" stroke="#c0bfbc" stroke-width="1.2"/>
  <rect x="777" y="446" width="186" height="49" rx="5" fill="#f6f5f4"/>
  <text class="text" x="792" y="476" font-size="14">Copy</text>
  <text class="muted" x="906" y="476" font-size="13">Ctrl+C</text>
  <text class="muted small" x="552" y="532">Right-click selected message text for Copy. No Cut, Paste, or Delete actions.</text>
  <text class="muted small" x="552" y="560">Only events received during this app session appear in the feed.</text>
</svg>
