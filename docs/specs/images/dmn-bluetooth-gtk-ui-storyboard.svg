<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320" role="img" aria-labelledby="title desc">
  <title id="title">Dmn Bluetooth GTK UI storyboard</title>
  <desc id="desc">Nine illustrative frames show first launch, selecting and saving a device, explicit start and external pairing, ANCS setup, waiting for the first notification, the live event feed, Preferences, recovery, and stopping or quitting.</desc>
  <defs>
    <style>
      .bg { fill: #eef1f5; }
      .card { fill: #ffffff; stroke: #c8d0d9; stroke-width: 2; }
      .window { fill: #ffffff; stroke: #b8c3ce; stroke-width: 1.5; }
      .bar { fill: #f7f8fa; }
      .line { stroke: #d7dde4; stroke-width: 1.5; }
      .ink { fill: #202a35; font-family: sans-serif; }
      .muted { fill: #657383; font-family: sans-serif; }
      .accent { fill: #276fb4; }
      .good { fill: #2d7448; }
      .warn { fill: #855a00; }
      .bad { fill: #a12d27; }
      .pill { fill: #eef3f8; stroke: #d5dde5; stroke-width: 1; }
      .selected { fill: #eff6fd; stroke: #9fc3e8; stroke-width: 1.5; }
      .button { fill: #ffffff; stroke: #aebac6; stroke-width: 1.2; }
      .primary { fill: #276fb4; stroke: #276fb4; stroke-width: 1.2; }
      .btntext { fill: #263543; font-family: sans-serif; font-size: 13px; }
      .white { fill: #ffffff; font-family: sans-serif; font-size: 13px; font-weight: 700; }
      .h { font-size: 18px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
      .tiny { font-size: 10px; }
    </style>
  </defs>
  <rect class="bg" width="1920" height="1320"/>
  <text class="ink" x="38" y="46" font-size="28" font-weight="700">Dmn Bluetooth · GTK UI storyboard</text>
  <text class="muted" x="38" y="73" font-size="15">Illustrative flow · numbered states, user actions, and backend transitions · initial release limit: one active phone</text>

  <!-- Frame 01 -->
  <g transform="translate(30 96)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">01 · FIRST LAUNCH / EMPTY INVENTORY</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">Dmn Bluetooth</text>
    <text class="muted body" x="38" y="112">Monitor live notifications shared by a selected iPhone.</text>
    <text class="muted body" x="38" y="133">Notification content stays in this session and is cleared on quit.</text>
    <rect class="pill" x="38" y="145" width="524" height="99" rx="8"/>
    <text class="ink body" x="54" y="169" font-weight="700">No iPhone devices are in the current inventory.</text>
    <text class="muted small" x="54" y="191">Nearby devices require an explicit scan; no scan starts on launch.</text>
    <text class="muted tiny" x="54" y="211">Adapter</text>
    <rect class="button" x="112" y="196" width="169" height="30" rx="6"/>
    <text class="btntext" x="124" y="216">Built-in Bluetooth ▾</text>
    <rect class="button" x="285" y="263" width="133" height="38" rx="7"/>
    <text class="btntext" x="307" y="287">Refresh devices</text>
    <rect class="primary" x="428" y="263" width="132" height="38" rx="7"/>
    <text class="white" x="449" y="287">Scan for devices</text>
    <text class="muted small" x="18" y="347">NEXT: scan or inventory results → 02 · Empty/error variants are required.</text>
  </g>

  <!-- Frame 02 -->
  <g transform="translate(660 96)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">02 · CHOOSE &amp; SAVE DEVICE</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">Choose a phone</text>
    <text class="muted small" x="38" y="103">Select one device · monitoring limit for this release</text>
    <rect class="selected" x="36" y="113" width="528" height="58" rx="7"/>
    <rect x="51" y="132" width="17" height="17" rx="3" fill="#276fb4"/>
    <path d="m54 140 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/>
    <text class="ink body" x="82" y="137" font-weight="700">iPhone Genghis</text>
    <text class="muted small" x="82" y="156">Paired · Disconnected · Adapter …:41:8A</text>
    <rect class="button" x="36" y="178" width="528" height="51" rx="7"/>
    <rect x="51" y="195" width="17" height="17" rx="3" fill="#fff" stroke="#8795a3"/>
    <text class="ink body" x="82" y="199" font-weight="700">iPhone Old</text>
    <text class="warn small" x="82" y="217">Not paired · Adapter …:31:20</text>
    <text class="muted tiny" x="38" y="244">Scan active on selected adapter · Stop scan</text>
    <text class="muted tiny" x="38" y="258">Selection is draft; save does not pair or connect.</text>
    <rect class="button" x="331" y="270" width="100" height="28" rx="7"/>
    <text class="btntext" x="354" y="289">Discard</text>
    <rect class="primary" x="440" y="270" width="105" height="28" rx="7"/>
    <text class="white" x="456" y="289">Save choice</text>
    <text class="muted small" x="18" y="347">NEXT: saved target → explicit Monitor selected action.</text>
  </g>

  <!-- Frame 03 -->
  <g transform="translate(1290 96)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">03 · EXPLICIT START / SYSTEM PAIRING</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">iPhone Old</text>
    <text class="warn body" x="40" y="106" font-weight="700">iPhone Old · Not paired</text>
    <text class="muted body" x="40" y="128">This explicit action requests connect/pairing now.</text>
    <rect class="button" x="48" y="143" width="150" height="35" rx="7"/>
    <text class="btntext" x="63" y="166">Monitor selected</text>
    <rect x="98" y="183" width="445" height="112" rx="9" fill="#f7f8fa" stroke="#9ca8b4" stroke-width="2"/>
    <text class="ink small" x="117" y="207" font-weight="700">External system pairing prompt</text>
    <text class="muted tiny" x="117" y="228">Rendered by the desktop / BlueZ, not by Dmn Bluetooth.</text>
    <text class="muted tiny" x="117" y="246">The app waits for BlueZ to confirm or reject pairing.</text>
    <rect class="button" x="335" y="257" width="83" height="27" rx="6"/>
    <text class="btntext" x="355" y="275">Deny</text>
    <rect class="primary" x="427" y="257" width="99" height="27" rx="6"/>
    <text class="white" x="443" y="275">Approve</text>
    <text class="muted small" x="18" y="347">NEXT: user starts; approval → 04 · deny → row status + Retry.</text>
  </g>

  <!-- Frame 04 -->
  <g transform="translate(30 500)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">04 · CONNECTING / ANCS SETUP</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">Monitoring iPhone Genghis</text>
    <text class="good small" x="40" y="108">✓ Pairing confirmed</text>
    <text class="good small" x="40" y="135">✓ Connecting to device</text>
    <text class="accent small" x="40" y="162" font-weight="700">◌ Waiting for services</text>
    <text class="muted small" x="40" y="189">○ Checking ANCS characteristics</text>
    <text class="muted small" x="40" y="216">○ Confirming both subscriptions</text>
    <rect class="pill" x="38" y="232" width="520" height="34" rx="7"/>
    <text class="muted tiny" x="51" y="253">Connected is not the same as notification-ready.</text>
    <rect class="button" x="438" y="274" width="119" height="34" rx="7"/>
    <text class="btntext" x="458" y="296">Stop selected</text>
    <text class="muted small" x="18" y="347">NEXT: both Notifying=true → 05 · otherwise → 08.</text>
  </g>

  <!-- Frame 05 -->
  <g transform="translate(660 500)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">05 · READY / WAITING FOR FIRST EVENT</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">iPhone Genghis</text>
    <text class="good body" x="39" y="108" font-weight="700">Ready · waiting for the first notification</text>
    <rect class="pill" x="38" y="126" width="520" height="89" rx="8"/>
    <text class="ink body" x="54" y="151" font-weight="700">No events in this session yet</text>
    <text class="muted small" x="54" y="174">ANCS is active. Older iPhone notifications are not imported.</text>
    <text class="muted small" x="54" y="196">iOS may ask for access when a new notification arrives.</text>
    <text class="muted small" x="39" y="242">If prompted, approve on the iPhone. The app cannot infer consent.</text>
    <rect class="button" x="438" y="269" width="119" height="36" rx="7"/>
    <text class="btntext" x="458" y="292">Stop selected</text>
    <text class="muted small" x="18" y="347">NEXT: new event delivered → 06 · no event is still a valid state.</text>
  </g>

  <!-- Frame 06 -->
  <g transform="translate(1290 500)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">06 · LIVE FEED / EVENT DETAILS</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">Dmn Bluetooth</text>
    <text class="muted tiny" x="38" y="99">DEVICE</text><text class="muted tiny" x="157" y="99">RECEIVED</text><text class="muted tiny" x="250" y="99">TYPE</text><text class="muted tiny" x="325" y="99">NOTIFICATION</text>
    <rect class="selected" x="35" y="108" width="529" height="42" rx="5"/>
    <text class="ink small" x="46" y="126">Genghis</text><text class="ink small" x="157" y="126">10:42:08</text><text class="ink small" x="250" y="126">Added</text><text class="ink small" x="325" y="126">Messages · New notification</text>
    <path class="line" d="M36 155H563"/>
    <text class="ink small" x="46" y="173">Genghis</text><text class="ink small" x="157" y="173">10:39:51</text><text class="ink small" x="250" y="173">Updated</text><text class="ink small" x="325" y="173">Calendar · Event updated</text>
    <rect class="pill" x="37" y="193" width="526" height="67" rx="7"/>
    <text class="ink small" x="51" y="214" font-weight="700">Selected notification details</text>
    <text class="muted tiny" x="51" y="234">Only attributes received from the phone · missing fields unavailable</text>
    <text class="muted tiny" x="51" y="250">Removed events never show stale message attributes.</text>
    <text class="muted tiny" x="38" y="282">Search/filter · Clear notifications · newest arrival first · max 1,000</text>
    <text class="muted small" x="18" y="347">NEXT: Preferences action → 07 · runtime error → 08.</text>
  </g>

  <!-- Frame 07 -->
  <g transform="translate(30 904)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">07 · PREFERENCES</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">Preferences</text>
    <text class="ink body" x="40" y="111" font-weight="700">Notifications</text>
    <text class="ink small" x="40" y="135">Desktop alerts</text>
    <rect x="490" y="119" width="47" height="23" rx="12" fill="#dce1e6"/>
    <circle cx="502" cy="130" r="9" fill="#fff"/>
    <text class="muted tiny" x="40" y="157">Off by default · generic content only when enabled.</text>
    <path class="line" d="M39 174H558"/>
    <text class="ink body" x="40" y="199" font-weight="700">Window and monitoring</text>
    <text class="ink small" x="40" y="222">Keep monitoring when the window is closed</text>
    <rect x="490" y="206" width="47" height="23" rx="12" fill="#dce1e6"/>
    <circle cx="502" cy="217" r="9" fill="#fff"/>
    <text class="muted tiny" x="40" y="244">Off by default · quitting always stops monitoring.</text>
    <path class="line" d="M39 258H558"/>
    <text class="muted tiny" x="40" y="279">Notification content is memory-only and cleared on quit.</text>
    <text class="muted small" x="18" y="347">RETURN: close Preferences → same device/feed state.</text>
  </g>

  <!-- Frame 08 -->
  <g transform="translate(660 904)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">08 · FAILURE / RECOVERY</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">iPhone Genghis</text>
    <rect x="38" y="88" width="522" height="75" rx="8" fill="#fff2f0" stroke="#e2b6b1"/>
    <text class="bad body" x="53" y="112" font-weight="700">ANCS service was not found</text>
    <text class="ink small" x="53" y="135">Connected, but notification monitoring cannot start.</text>
    <text class="muted tiny" x="40" y="185">This is not a pairing failure. No iOS access prompt is implied.</text>
    <text class="muted tiny" x="40" y="205">One observed recovery required forgetting the bond on iPhone</text>
    <text class="muted tiny" x="40" y="222">and pairing again; this removes the existing pairing.</text>
    <rect class="button" x="316" y="262" width="102" height="37" rx="7"/>
    <text class="btntext" x="346" y="285">Stop</text>
    <rect class="primary" x="430" y="262" width="128" height="37" rx="7"/>
    <text class="white" x="465" y="285">Retry</text>
    <text class="muted small" x="18" y="347">Other failures have distinct copy; never auto-forget or disconnect.</text>
  </g>

  <!-- Frame 09 -->
  <g transform="translate(1290 904)">
    <rect class="card" width="600" height="378" rx="14"/>
    <text class="accent" x="18" y="29" font-size="13" font-weight="700">09 · STOP / CLOSE / QUIT</text>
    <rect class="window" x="18" y="43" width="564" height="280" rx="10"/>
    <rect class="bar" x="18" y="43" width="564" height="38" rx="10"/>
    <text class="ink h" x="34" y="69">Monitoring is active</text>
    <rect class="pill" x="38" y="91" width="522" height="99" rx="8"/>
    <text class="ink body" x="54" y="116" font-weight="700">Stop monitoring and quit?</text>
    <text class="muted small" x="54" y="140">Stopping clears this session's notification content.</text>
    <text class="muted small" x="54" y="161">Your Bluetooth pairing and connection are left intact.</text>
    <rect class="button" x="253" y="225" width="96" height="38" rx="7"/>
    <text class="btntext" x="282" y="249">Cancel</text>
    <rect class="button" x="359" y="225" width="116" height="38" rx="7"/>
    <text class="btntext" x="371" y="249">Hide &amp; monitor</text>
    <rect class="primary" x="484" y="225" width="76" height="38" rx="7"/>
    <text class="white" x="495" y="249">Stop &amp; quit</text>
    <text class="muted tiny" x="40" y="283">“Hide &amp; monitor” appears only when the opt-in preference is enabled.</text>
    <text class="muted small" x="18" y="347">NEXT: await cleanup, then quit · hide is not a background service.</text>
  </g>
</svg>
