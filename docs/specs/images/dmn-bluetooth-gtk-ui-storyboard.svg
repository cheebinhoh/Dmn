<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1290" viewBox="0 0 1720 1290" role="img" aria-labelledby="title desc">
  <title id="title">Dmn Bluetooth current GTK UI storyboard</title>
  <desc id="desc">Five current application states show the device inventory, draft selection, connection without monitoring, explicit monitor startup and ready state, and the live event feed with a Copy-only context menu.</desc>
  <defs>
    <style>
      .bg { fill: #f6f5f4; }
      .card { fill: #ffffff; stroke: #c0bfbc; stroke-width: 1.5; }
      .header { fill: #f6f5f4; }
      .text { fill: #241f31; font-family: sans-serif; }
      .muted { fill: #5e5c64; font-family: sans-serif; }
      .line { stroke: #deddda; stroke-width: 1; }
      .button { fill: #ffffff; stroke: #c0bfbc; stroke-width: 1; }
      .primary { fill: #3584e4; stroke: #3584e4; }
      .disabled { fill: #f6f5f4; stroke: #deddda; }
      .blue { fill: #3584e4; }
      .label { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .frameTitle { fill: #1c71d8; font-family: sans-serif; font-size: 17px; font-weight: 700; }
      .buttonText { fill: #241f31; font-family: sans-serif; font-size: 11px; }
      .white { fill: #ffffff; font-family: sans-serif; font-size: 11px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1720" height="1290"/>
  <text class="text" x="40" y="48" font-size="30" font-weight="700">Dmn Bluetooth · current GTK UI storyboard</text>
  <text class="muted" x="40" y="77" font-size="16">Implementation-accurate states · actions remain explicit · event filters implemented; Preferences and desktop alerts remain planned</text>

  <!-- Frame 01: inventory -->
  <g transform="translate(40 112)">
    <rect class="card" width="800" height="330" rx="12"/>
    <text class="frameTitle" x="22" y="32">01 · INVENTORY / INITIAL EMPTY STATE</text>
    <rect class="header" x="16" y="48" width="768" height="42" rx="8"/>
    <text class="text" x="34" y="75" font-size="17" font-weight="700">Devices</text>
    <rect class="button" x="710" y="56" width="56" height="28" rx="5"/>
    <text class="muted small" x="731" y="75">Menu</text>
    <text class="muted small" x="34" y="119">Choose a phone to monitor. Selection is saved separately from pairing or connecting.</text>
    <rect class="button" x="34" y="133" width="730" height="30" rx="5"/>
    <text class="text small" x="48" y="153">Bluetooth adapter ▾</text>
    <rect class="button" x="34" y="173" width="125" height="31" rx="5"/>
    <text class="buttonText" x="49" y="193">Refresh devices</text>
    <rect class="button" x="166" y="173" width="131" height="31" rx="5"/>
    <text class="buttonText" x="179" y="193">Scan for devices</text>
    <rect class="button" x="304" y="173" width="103" height="31" rx="5"/>
    <text class="buttonText" x="322" y="193">Stop scan</text>
    <text class="text small" x="37" y="232" font-weight="700">Name ↑</text>
    <text class="text small" x="354" y="232" font-weight="700">Status</text>
    <path class="line" d="M34 242H764"/>
    <text class="muted small" x="55" y="275">No known devices. Scan to find a nearby phone.</text>
    <text class="muted small" x="34" y="312">The detail pane prompts for a device. Scanning starts only when requested.</text>
  </g>

  <!-- Frame 02: selection -->
  <g transform="translate(880 112)">
    <rect class="card" width="800" height="330" rx="12"/>
    <text class="frameTitle" x="22" y="32">02 · DRAFT SELECTION / DEVICE ACTIONS</text>
    <rect class="header" x="16" y="48" width="768" height="42" rx="8"/>
    <text class="text" x="34" y="75" font-size="17" font-weight="700">Devices</text>
    <text class="text small" x="37" y="120" font-weight="700">Name ↑</text>
    <text class="text small" x="354" y="120" font-weight="700">Status</text>
    <path class="line" d="M34 129H764"/>
    <rect x="34" y="130" width="730" height="85" fill="#ffffff"/>
    <rect class="blue" x="49" y="145" width="17" height="17" rx="3"/>
    <path d="m53 153 4 4 7-8" fill="none" stroke="#ffffff" stroke-width="1.7"/>
    <text class="text label" x="77" y="158" font-weight="700">iPhone Genghis</text>
    <text class="muted small" x="77" y="177">Paired · Disconnected</text>
    <rect class="disabled" x="450" y="173" width="104" height="29" rx="5"/>
    <text class="muted tiny" x="482" y="192">Connect</text>
    <rect class="disabled" x="561" y="173" width="158" height="29" rx="5"/>
    <text class="muted tiny" x="578" y="192">Start monitoring</text>
    <path class="line" d="M34 215H764"/>
    <rect class="button" x="34" y="229" width="126" height="31" rx="5"/>
    <text class="buttonText" x="48" y="249">Save selection</text>
    <rect class="button" x="167" y="229" width="137" height="31" rx="5"/>
    <text class="buttonText" x="180" y="249">Discard changes</text>
    <rect x="611" y="237" width="16" height="16" rx="3" fill="#ffffff" stroke="#8e8d8b"/>
    <text class="text small" x="635" y="250">Selected only</text>
    <text class="muted small" x="34" y="292">Checking changes the draft only. Save does not connect; Connect does not monitor.</text>
  </g>

  <!-- Frame 03: connected, not monitored -->
  <g transform="translate(40 472)">
    <rect class="card" width="800" height="330" rx="12"/>
    <text class="frameTitle" x="22" y="32">03 · CONNECTED / NOT MONITORING</text>
    <rect class="header" x="16" y="48" width="768" height="42" rx="8"/>
    <rect class="button" x="32" y="55" width="34" height="28" rx="5"/>
    <text class="text" x="43" y="75" font-size="19">‹</text>
    <text class="text" x="80" y="75" font-size="17" font-weight="700">Notifications</text>
    <text class="text" x="40" y="125" font-size="21" font-weight="700">iPhone Genghis</text>
    <text class="muted label" x="40" y="151">Paired · Connected · Saved</text>
    <text class="muted small" x="40" y="180">A Bluetooth connection alone does not subscribe to ANCS.</text>
    <text class="text small" x="40" y="211" font-weight="700">Notifications · iPhone Genghis</text>
    <rect class="card" x="36" y="222" width="728" height="66" rx="6"/>
    <text class="muted small" x="52" y="248">No notifications have been received in this app session.</text>
    <rect class="button" x="580" y="295" width="174" height="28" rx="5"/>
    <text class="buttonText" x="598" y="314">Start monitoring</text>
    <text class="muted tiny" x="40" y="315">The enabled action is explicit.</text>
  </g>

  <!-- Frame 04: ready state -->
  <g transform="translate(880 472)">
    <rect class="card" width="800" height="330" rx="12"/>
    <text class="frameTitle" x="22" y="32">04 · MONITOR READY / WAITING FOR EVENT</text>
    <rect class="header" x="16" y="48" width="768" height="42" rx="8"/>
    <text class="text" x="34" y="75" font-size="17" font-weight="700">Devices</text>
    <text class="text label" x="42" y="124" font-weight="700">iPhone Genghis</text>
    <text class="muted small" x="42" y="145">Paired · Connected · Ready · waiting for new notifications</text>
    <text class="text" x="42" y="181" font-size="21" font-weight="700">iPhone Genghis</text>
    <text class="muted label" x="42" y="205">Paired · Connected · Saved · Ready · waiting for new notifications</text>
    <text class="text small" x="42" y="240" font-weight="700">Notifications · iPhone Genghis</text>
    <rect x="38" y="251" width="725" height="55" rx="6" fill="#f6f5f4"/>
    <text class="text small" x="55" y="274">ANCS is ready. Only new notifications received while this monitor is running appear here.</text>
    <text class="muted small" x="55" y="294">iOS may ask for access after a new notification arrives.</text>
    <text class="muted tiny" x="580" y="322">Stop monitoring leaves Bluetooth connected.</text>
  </g>

  <!-- Frame 05: event feed and copy -->
  <g transform="translate(40 832)">
    <rect class="card" width="1640" height="410" rx="12"/>
    <text class="frameTitle" x="22" y="32">05 · FILTERED LIVE FEED / EVENT DETAILS / COPY-ONLY MENU</text>
    <rect class="header" x="16" y="48" width="1608" height="42" rx="8"/>
    <rect class="button" x="32" y="55" width="34" height="28" rx="5"/>
    <text class="text" x="43" y="75" font-size="19">‹</text>
    <text class="text" x="80" y="75" font-size="17" font-weight="700">Notifications</text>
    <text class="text" x="44" y="129" font-size="21" font-weight="700">iPhone Genghis</text>
    <text class="muted small" x="44" y="151">Paired · Connected · Saved · Ready · waiting for new notifications</text>
    <text class="text" x="44" y="188" font-size="18" font-weight="700">Notifications · iPhone Genghis</text>
    <rect class="button" x="44" y="198" width="470" height="27" rx="5"/>
    <text class="muted small" x="57" y="216">Search notifications</text>
    <rect x="538" y="204" width="15" height="15" rx="3" fill="#ffffff" stroke="#8e8d8b"/>
    <text class="text small" x="561" y="216">All devices</text>
    <rect class="button" x="44" y="231" width="160" height="27" rx="5"/>
    <text class="buttonText" x="56" y="249">Any event ▾</text>
    <rect class="button" x="211" y="231" width="175" height="27" rx="5"/>
    <text class="buttonText" x="223" y="249">Any category ▾</text>
    <rect class="button" x="393" y="231" width="125" height="27" rx="5"/>
    <text class="buttonText" x="405" y="249">Clear filters</text>
    <rect class="button" x="525" y="231" width="175" height="27" rx="5"/>
    <text class="buttonText" x="537" y="249">Clear notifications</text>
    <rect x="36" y="265" width="1555" height="104" rx="6" fill="#ffffff"/>
    <text class="muted small" x="50" y="284" font-weight="700">Device</text>
    <text class="muted small" x="220" y="284" font-weight="700">Received</text>
    <text class="muted small" x="350" y="284" font-weight="700">Type / category</text>
    <text class="muted small" x="560" y="284" font-weight="700">Notification</text>
    <path class="line" d="M36 291H1591"/>
    <text class="text small" x="50" y="312">iPhone Genghis</text>
    <text class="muted small" x="220" y="312">16:50:38</text>
    <text class="muted small" x="350" y="312">Added · Social</text>
    <text class="text small" x="560" y="312">Messages · New message received</text>
    <text class="text small" x="560" y="329">Selectable preview from this monitor session.</text>
    <path class="line" d="M36 338H1591"/>
    <text class="text small" x="50" y="358">iPhone Genghis</text>
    <text class="muted small" x="220" y="358">16:48:04</text>
    <text class="muted small" x="350" y="358">Updated · Schedule</text>
    <text class="text small" x="560" y="358">Calendar · Event updated</text>
    <rect x="885" y="305" width="190" height="58" rx="8" fill="#ffffff" stroke="#c0bfbc" stroke-width="1.2"/>
    <rect x="893" y="313" width="174" height="42" rx="5" fill="#f6f5f4"/>
    <text class="text label" x="910" y="340">Copy</text>
    <text class="muted small" x="1002" y="340">Ctrl+C</text>
    <text class="muted small" x="44" y="392">Hover wraps full notification text to the pane width. Activate a row for details; newest first; at most 1,000 events retained.</text>
  </g>
</svg>
