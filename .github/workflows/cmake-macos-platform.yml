name: build and run on macOS platform

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: 'For macOS build and test run'
        required: false
        default: 'Manual run on macOS'

env:
  BUILD_TYPE: Debug

permissions:
  contents: read

jobs:
  macos-build-test:
    # Use macos-latest (currently macOS 14/15)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ICU
        run: brew install icu4c

      - name: Configure CMake
        # This job tests the portable build; BlueZ and D-Bus are Linux-only
        # optional targets. ICU is keg-only in Homebrew, so provide its prefix.
        run: |
          cmake -B ${{github.workspace}}/build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DDMN_BUILD_TESTS=ON \
            -DDMN_ALLOW_DEPENDENCY_FETCH=ON \
            -DENABLE_BLUEZ=OFF \
            -DENABLE_DBUS=OFF \
            -DICU_ROOT="$(brew --prefix icu4c)"

      - name: Build
        # Build the project
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        # Run ctest or your specific binary
        run: ctest -C ${{env.BUILD_TYPE}} -L dmn -VV --output-on-failure
