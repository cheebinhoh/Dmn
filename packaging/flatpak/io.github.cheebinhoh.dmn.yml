app-id: io.github.cheebinhoh.dmn
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: dmn-bluetooth-gtk
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --system-talk-name=org.bluez
  - --talk-name=ca.desrt.dconf
  - --filesystem=xdg-run/dconf
cleanup:
  - /include
  - /lib/dmn
modules:
  - name: dmn-bluetooth
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_APP_BLUETOOTH_GTK=ON
      - -DBUILD_SHARED_LIBS=OFF
      - -DDMN_BUILD_TESTS=OFF
      - -DDMN_ALLOW_DEPENDENCY_FETCH=OFF
      - -DENABLE_DMN_DMESGNET=OFF
      - -DDMN_BLUETOOTH_GTK_APP_ID=io.github.cheebinhoh.dmn
    post-install:
      - install -Dm0644 LICENSE "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/dmn-bluetooth/LICENSE"
    sources:
      - type: git
        url: https://github.com/cheebinhoh/Dmn.git
        tag: 0.9.1
